testing:
  strict_tdd: false
  reason: |
    No explicit workspace-level test command covers every in-scope project. The single
    on-disk project (firmware/gateway) requires `cd firmware/gateway/test && idf.py test`
    — that command is project-local, not workspace-orchestrated, and three of the five
    project entries are not yet scaffolded. Per the decision gate, strict_tdd falls
    closed to false and downstream phases must rely on the documented project-local
    commands preserved below.
  fallback_policy: project-local commands only; each phase must declare which projects
    it exercises and the exact command per project.

rules:
  proposal:
    - Include rollback plan for any change that touches in-flight openspec/changes/ artifacts.
    - State which discovered project(s) the change affects and the test command per project.
    - Keep proposals compatible with the active educational phase ordering (Fases 0-6).
  specs:
    - Use Given/When/Then for every scenario.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Write spec narrative in English; cite Spanish-language tutorial files only when preserving wording.
    - Preserve the protocol source of truth in docs/replanificacion/02-protocolo-unificado.md.
  design:
    - Document hardware-affecting decisions with rationale (especially GPIO assignments and PSRAM constraints on GPIO35-37).
    - Include sequence diagrams for ESP-NOW, OTA, WebSocket, and SPIFFS-served Preact flows.
    - State memory budget per component (RAM, PSRAM, SPIFFS).
    - State power budget per node firmware path (deep sleep currents).
  tasks:
    - Group by phase (Fase 0-6), use hierarchical numbering T-XX.YY.
    - Keep tasks completable in one session unless explicitly chained.
    - Bind every implementation task to a project-local test command (or — if not applicable).
  apply:
    guidelines:
      - Follow ESP-IDF coding conventions (snake_case, ESP_LOGx, esp_err_t).
      - Reserve GPIO35/36/37 for Octal PSRAM; GPIO48 for onboard RGB LED; GPIO19/20 for native USB.
      - Use esp_log with module-specific tags; never printf.
      - Forbid the withdrawn 0.1155 mm pixel pitch and any geometry derived from it.
    tdd: false
    test_command: "cd firmware/gateway/test && idf.py test"
  verify:
    test_command: "cd firmware/gateway/test && idf.py test"
    build_command: "cd firmware/gateway && idf.py build"
    coverage_threshold: 0
    additional_gates:
      - "mkdocs build --strict" (docs_site/ integrity)
  archive:
    - Warn before merging any REMOVED delta that affects active runtime behavior.
    - Preserve archived change folders verbatim (audit trail).

conventions:
  language: c11
  framework: esp-idf v5.x
  build: cmake + idf.py
  naming: snake_case C; module-prefixed function names (e.g. wifi_manager_init)
  logging: ESP_LOGx with module tag
  errors: ESP_ERROR_CHECK for fatal, esp_err_t returns for recoverable
  nvs: one namespace per module
  components: ESP-IDF component structure for reusable modules
  docs_narrative_language: European Spanish (docs_site/, Tutorial/, Fases/, knowledge/)
  sd_artifact_language: English (openspec/, .atl/)

open_constraints:
  - The external 8-pin LCD module is not hardware-validated; do not commit GPIO assignments until the carrier board and module are verified.
  - Display pixel pitch is unknown; the seller value 0.1155 mm is withdrawn and must not be reused.
  - The 20 mA operating current is not scoped (whole-module vs backlight vs per-LED).
  - Display backlight control, reset polarity, and logic input levels are unresolved.
  - SPIFFS partition size for the Preact SPA is pending ODD-3.
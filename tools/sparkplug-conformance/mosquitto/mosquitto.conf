# Mosquitto configuration for the Sparkplug B conformance harness.
#
# =============================================================================
#  TEST / DEVELOPMENT ONLY — NEVER USE THIS CONFIGURATION IN PRODUCTION.
#
#  There is no authentication (allow_anonymous true) and no encryption
#  (plaintext listener).  Anyone able to reach this port can read and inject
#  Sparkplug traffic.  The broker is disposable: it is started and torn down
#  by scripts/run-conformance.sh and is never intended to outlive a test run.
# =============================================================================

# Plaintext MQTT 3.1.1 listener.
# The harness speaks 3.1.1 because the ESP32-S3 gateway's MQTT client is
# pinned to 3.1.1 in the firmware; adding a v5 listener here would not help.
listener 1883

# No credentials on purpose: the harness carries no secrets and the broker is
# a throwaway instance bound to a local test network.
allow_anonymous true

# No persistence.  Every run must start from a clean broker state, otherwise
# a retained or queued message from a previous run would corrupt the
# birth-death sequence (bdSeq) and sequence-number (seq) assertions.
persistence false

# Keep the broker chatty about errors but quiet about routine traffic, so the
# harness output stays readable.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

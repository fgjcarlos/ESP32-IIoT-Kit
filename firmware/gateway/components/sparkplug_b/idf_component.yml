## IDF component manager manifest for sparkplug_b.
##
## - nanopb 0.4.9 is the latest 0.4.x release and the API we target. The
##   nanopb 1.0 prerelease has breaking schema changes; we stay on 0.4.9
##   until the gateway sees its first production build of Sparkplug.
## - livekit/nanopb is an ESP Component Registry mirror (Zlib). Not an
##   official nanopb release channel, but it tracks 0.4.9.x and is the
##   most downloaded nanopb component for ESP-IDF (~19.4k pulls at the
##   time of vendoring).
## - Pinning to ~0.4.9 avoids a surprise upgrade to 1.0 during a feature
##   branch build.
## - The shared `protocol` component (firmware/common/protocol) is pulled
##   in via EXTRA_COMPONENT_DIRS in firmware/gateway/CMakeLists.txt — it
##   is not a registry dependency.
##
## Refs:
##   - https://components.espressif.com/components/livekit/nanopb
##   - https://pypi.org/project/nanopb/0.4.9.1/
##
## Why the .pb.{h,c} files are NOT generated by idf build:
##   ESP-IDF's component_get_requirements.cmake runs in script mode and
##   rejects `add_custom_command` from inside a component CMakeLists. We
##   generate the bindings at vendoring time and ship them as part of the
##   component (see proto/SOURCE.md for the regeneration command).

dependencies:
  livekit/nanopb: "~0.4.9"